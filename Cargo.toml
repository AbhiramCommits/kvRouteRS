[workspace]
resolver = "2"
members = [
    "crates/router-core",
    "crates/router-server",
    "crates/router-py",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
router-core = { path = "crates/router-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"

[profile.release]
# Strip debug symbols: keeps the distroless container image well under 50MB.
strip = true
