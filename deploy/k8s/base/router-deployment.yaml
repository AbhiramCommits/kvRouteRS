# The router runs as a Deployment per the requirements, but note the
# consequence honestly: replicas > 1 *partition* the prefix index. Each
# replica only records the routing decisions it made, so two replicas each
# know roughly half of the cache residency. Hit rates therefore drop as
# replicas scale — the production follow-up is a shared index store (etcd),
# which Dynamo itself does for its router state.
#
# Draining: the router shuts down gracefully on SIGTERM (axum stops
# accepting, in-flight streams finish). The preStop sleep gives the Service
# endpoints time to deregister this pod and lets long SSE streams wind down;
# terminationGracePeriodSeconds (30s) is the backstop before SIGKILL.
# distroless has no shell, so preStop uses its bundled busybox.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kvrouter-router
  labels:
    app: kvrouter-router
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kvrouter-router
  template:
    metadata:
      labels:
        app: kvrouter-router
    spec:
      terminationGracePeriodSeconds: 30
      serviceAccountName: kvrouter-router
      containers:
        - name: router
          image: ghcr.io/kvrouters/router:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: ROUTER_CONFIG
              value: /etc/kvrouters/router.yaml
            - name: ROUTER_BIND
              value: 0.0.0.0:8080
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Readiness requires at least one healthy worker (discovered or
          # static), so the router never receives traffic it cannot route.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/busybox/sh", "-c", "sleep 20"]
          volumeMounts:
            - name: config
              mountPath: /etc/kvrouters
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kvrouters-config
