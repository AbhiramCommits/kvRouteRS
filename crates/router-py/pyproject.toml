[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "kvrouters"
version = "0.1.0"
description = "KV-cache-aware inference routing core: Rust bindings plus a thin Python SDK (kvrouters_sdk)"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "kvrouters contributors" }]
dependencies = ["httpx>=0.27"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: OS Independent",
]

[tool.maturin]
bindings = "pyo3"
# Mixed layout: the Rust extension lives at kvrouters._native; the pure-Python
# package (typing stubs, re-exports) and the kvrouters_sdk package are merged
# in from python-source.
module-name = "kvrouters._native"
python-source = "../../python"
features = ["pyo3/extension-module"]
strip = true
