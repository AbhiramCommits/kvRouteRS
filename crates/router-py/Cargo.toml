[package]
name = "router-py"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PyO3 bindings for the kvRouteRS router (kvrouters)"

[lib]
name = "kvrouters"
crate-type = ["cdylib"]

[dependencies]
router-core = { workspace = true }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }

[build-dependencies]
pyo3-build-config = "0.29"
