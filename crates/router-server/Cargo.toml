[package]
name = "router-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenAI-compatible HTTP frontend for the kvRouteRS router"

[dependencies]
router-core = { workspace = true }
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.17"
kube = { version = "0.98", default-features = false, features = ["client", "runtime", "rustls-tls"] }
# Must match the k8s-openapi version kube depends on (0.24) so the v1_30
# feature unifies onto a single build.
k8s-openapi = { version = "0.24", features = ["v1_30"] }
# kube's rustls-tls does not enable a crypto provider; reqwest enables
# aws-lc-rs on the same rustls build. Pinning our side to aws_lc_rs too keeps
# exactly one provider feature enabled, and serve() installs it explicitly.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
