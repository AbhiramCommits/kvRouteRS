[package]
name = "router-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Routing logic, prefix index, and worker registry for the kvRouteRS router"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
smallvec = "1"
thiserror = { workspace = true }
# tokio is used only for time/task primitives (the eviction task and the mock KV
# transfer), never for I/O — the core stays transport-agnostic.
tokio = { version = "1", features = ["rt", "time"] }
tracing = { workspace = true }

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
