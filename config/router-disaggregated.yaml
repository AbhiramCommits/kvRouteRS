routing_policy: disaggregated
health_check_interval_secs: 2

prompt_block_chars: 512
cache_weight: 1.0
load_weight: 0.5

prefix_index_ttl_secs: 300
prefix_index_max_entries: 100000

kv_transfer_cost_ms: 15

workers:
  - url: http://mock1:8001
    pool: prefill
  - url: http://mock2:8001
    pool: prefill
  - url: http://mock3:8001
    pool: decode
  - url: http://mock4:8001
    pool: decode
